name: CI

on:
  push:
  pull_request:

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target v2_tests
      - name: Test
        run: ctest --test-dir build -R v2 --output-on-failure

  sanitizer:
    name: Debug Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --target v2_tests
      - name: Test
        run: ctest --test-dir build -R v2 --output-on-failure

  sanitizer-fuzz:
    name: Sanitizer Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_SANITIZERS=ON -DBUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-fuzz --target v2_fuzz
      - name: Run
        run: ./build-fuzz/v2_fuzz --seeds 100000 --steps-budget 10000000 --players 0

  bench:
    name: Bench Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target v2_bench
      - name: Run
        run: ./build/v2_bench
