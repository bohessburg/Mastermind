name: CI

on:
  push:
  pull_request:

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target v2_tests
      - name: Test
        run: ctest --test-dir build -R v2 --output-on-failure

  python-smoke:
    name: Python Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Create venv
        run: python3 -m venv .venv
      - name: Install Python deps
        run: ./.venv/bin/python -m pip install --upgrade pip numpy pybind11
      - name: Configure
        run: |
          PYBIND11_DIR="$(./.venv/bin/python -m pybind11 --cmakedir)"
          cmake -B build-py -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON -DPython3_EXECUTABLE="$PWD/.venv/bin/python" -Dpybind11_DIR="$PYBIND11_DIR"
      - name: Build
        run: cmake --build build-py --target dominion_v2_py
      - name: Smoke
        run: PYTHONPATH=build-py ./.venv/bin/python src/v2/py/test_smoke.py

  sanitizer:
    name: Debug Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --target v2_tests
      - name: Test
        run: ctest --test-dir build -R v2 --output-on-failure

  sanitizer-fuzz:
    name: Sanitizer Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_SANITIZERS=ON -DBUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-fuzz --target v2_fuzz
      - name: Run
        run: ./build-fuzz/v2_fuzz --seeds 100000 --steps-budget 10000000 --players 0

  bench:
    name: Bench Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target v2_bench
      - name: Run
        run: ./build/v2_bench | tee bench/current.json
      - name: Regression gate
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("bench/baseline.json", "r", encoding="utf-8") as f:
              baseline = json.load(f)
          with open("bench/current.json", "r", encoding="utf-8") as f:
              current = json.load(f)

          failures = []
          step_limit = baseline["step_median_ns"] * 1.15
          random_limit = baseline["random_games_per_sec"] * 0.85

          if current["step_median_ns"] > step_limit:
              failures.append(
                  f"step_median_ns {current['step_median_ns']} > {step_limit:.2f}"
              )
          if current["random_games_per_sec"] < random_limit:
              failures.append(
                  f"random_games_per_sec {current['random_games_per_sec']} < {random_limit:.2f}"
              )

          print("baseline:", json.dumps(baseline, sort_keys=True))
          print("current:", json.dumps(current, sort_keys=True))
          if failures:
              print("bench regression:", "; ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
