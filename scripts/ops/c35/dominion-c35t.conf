[program:dominion-c35t]
command=/bin/bash /root/c35t_driver.sh
directory=/root/Mastermind
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/root/Mastermind/supervisor-c35t.log
stdout_logfile_maxbytes=200MB
